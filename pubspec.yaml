name: teins_app
description: Aplicación móvil offline-first para visitas técnicas de TEINS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # ── Supabase ──────────────────────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── PowerSync (offline-first sync engine) ────────────────────────────────
  powersync: ^2.4.0

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Dependency Injection ─────────────────────────────────────────────────
  get_it: ^8.0.3

  # ── Forms ────────────────────────────────────────────────────────────────
  flutter_form_builder: 11.0.0
  form_builder_validators: ^11.1.2

  # ── State Management ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ── Camera / Photos ──────────────────────────────────────────────────────
  camera: ^0.11.1
  image_picker: ^1.1.2
  image: ^4.2.0

  # ── Local Storage / Secure Storage ───────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── Connectivity ─────────────────────────────────────────────────────────
  connectivity_plus: ^6.1.3
  internet_connection_checker_plus: ^2.6.1

  # ── UUID ─────────────────────────────────────────────────────────────────
  uuid: ^4.5.1

  # ── Utilities ────────────────────────────────────────────────────────────
  intl: ^0.20.3
  equatable: ^2.0.7
  dartz: ^0.10.1
  logger: ^2.5.0
  permission_handler: ^11.3.1

  # ── UI ───────────────────────────────────────────────────────────────────
  material_ui: ^1.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/templates/
